name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SDK_VERSION: "25.12.2"
  TARGET: "ramips"
  SUBTARGET: "mt7621"
  GCC: "14.3.0"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Download ImmortalWrt SDK
        run: |
          wget -q -O sdk.tar.zst \
            "https://downloads.immortalwrt.org/releases/${SDK_VERSION}/targets/${TARGET}/${SUBTARGET}/immortalwrt-sdk-${SDK_VERSION}-${TARGET}-${SUBTARGET}_gcc-${GCC}_musl.Linux-x86_64.tar.zst"
          tar --zstd -xf sdk.tar.zst

      - name: Copy packages into SDK
        run: |
          cp -r jluNetworkLogin immortalwrt-sdk-*/package/
          cp -r luci-app-jluNetworkLogin immortalwrt-sdk-*/package/

      - name: Build
        run: |
          cd immortalwrt-sdk-*/
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f
          make defconfig
          # 打开简体中文，让 luci-i18n-jluNetworkLogin-zh-cn 翻译包也被编出来
          sed -i 's/^# CONFIG_LUCI_LANG_zh_Hans is not set/CONFIG_LUCI_LANG_zh_Hans=y/' .config
          grep -q '^CONFIG_LUCI_LANG_zh_Hans=y' .config || echo 'CONFIG_LUCI_LANG_zh_Hans=y' >> .config
          make defconfig
          make package/jluNetworkLogin/compile V=s -j$(nproc)
          make package/luci-app-jluNetworkLogin/compile V=s -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jluNetworkLogin
          path: |
            immortalwrt-sdk-*/bin/packages/**/jluNetworkLogin*.apk
            immortalwrt-sdk-*/bin/packages/**/luci-app-jluNetworkLogin*.apk
            immortalwrt-sdk-*/bin/packages/**/luci-i18n-jluNetworkLogin*.apk
